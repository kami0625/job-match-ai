# ==================== CI: 测试 + 构建校验 ====================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (离线,无需 Ollama/MySQL/Chroma)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          pip install -r requirements.txt pytest
          # 测试不依赖 LLM/DB(mock),但需要 matplotlib 等运行依赖

      - name: 运行测试
        run: pytest tests/ -v --tb=short

  build:
    name: Docker Compose 配置校验(轻量,稳定)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # 不真做 docker build(装 chromadb/langchain 太慢,CI 不稳定)
      # 改为校验 compose 文件语法(秒级,稳定)
      - name: 校验 compose 文件
        run: |
          python -c "import yaml; yaml.safe_load(open('docker/docker-compose.yml', encoding='utf-8'))" \
            && echo "✅ compose yml 语法合法"
          python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml', encoding='utf-8'))" \
            && echo "✅ ci yml 语法合法"

      # 可选:本地手测 docker build 验证镜像能跑
      # - name: 构建后端镜像(本地手测,CI 跳过)
      #   run: docker build -f docker/backend.Dockerfile -t test-backend .
