# ==================== 求职匹配 AI 系统 · 一键部署 ====================
# 用法: docker compose up -d --build
# 访问: 前端 http://localhost:8501 / 后端 http://localhost:8000/docs
# 首次启动 ollama 需拉取模型: docker exec -it jobmatch-ollama ollama pull qwen2:7b
#                              docker exec -it jobmatch-ollama ollama pull nomic-embed-text
# 可选模型拉取入口(取消注释自动拉):
#   --entrypoint "sh -c 'ollama serve & sleep 5; ollama pull qwen2:7b; ollama pull nomic-embed-text; wait'"

services:
  mysql:
    image: mysql:8.0
    container_name: jobmatch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: job_match_ai
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/demo/样例岗位数据.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    container_name: jobmatch-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # 首次启动自动拉取模型(可注释掉手动拉)
    entrypoint: ["sh", "-c", "ollama serve & sleep 8; ollama pull qwen2:7b; ollama pull nomic-embed-text; wait"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: jobmatch-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: job_match_ai
      RAG_SERVICE_URL: http://backend:8000
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      OLLAMA_CHAT_MODEL: qwen2:7b
      OLLAMA_EMBED_MODEL: nomic-embed-text
    volumes:
      - chroma_data:/app/data/chroma_db
      - upload_data:/app/data/upload_files
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: jobmatch-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "8501:8501"

volumes:
  mysql_data:
  ollama_data:
  chroma_data:
  upload_data:
